name: CI — Build & Verify Targets

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Type-Check, Web App & NPM Library
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Run Integration Tests (Vitest + Babylon NullEngine)
        run: npm run test:integration

      - name: Build Standalone Web Application (dist/)
        run: npm run build

      - name: Build NPM Library & Web Component (dist-lib/)
        run: npm run build:lib

      - name: Pack NPM tarball
        run: npm pack

      - name: Upload Standalone Web App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesheditor-web-standalone
          path: dist/
          retention-days: 7

      - name: Upload NPM Library & Web Component Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesheditor-npm-library
          path: |
            dist-lib/
            mesheditor-*.tgz
          retention-days: 7

