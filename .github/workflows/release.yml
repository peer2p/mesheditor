name: Release & Distribute All Targets

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with all built artifacts'
        required: false
        default: false
        type: boolean
      publish_itch:
        description: 'Publish HTML5 & Desktop builds to itch.io (via ITCH_KEY)'
        required: false
        default: false
        type: boolean
      publish_gamejolt:
        description: 'Publish HTML5 & Desktop builds to Game Jolt (via GAMEJOLT_TOKEN & GAMEJOLT_PACKAGE_ID)'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Release tag name (used when triggered manually with create_release=true, e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ============================================================================
  # 1. BUILD STANDALONE WEB APP, WEB COMPONENT & NPM LIBRARY
  # ============================================================================
  build-web-and-lib:
    name: Build Web App & NPM Library
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check source
        run: npm run type-check

      - name: Build Standalone Web App
        run: npm run build

      - name: Prepare itch.io HTML5 Build
        run: node scripts/prepare-itch.js

      - name: Archive Standalone Web App (.zip)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifacts
          cd dist && zip -r "../artifacts/MeshEditor-${VERSION}-standalone-web.zip" . && cd ..

      - name: Build NPM Library & <mesh-editor> Web Component
        run: npm run build:lib

      - name: Package NPM Library (.tgz) & Standalone Web Component (.zip)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          cd dist-lib && zip -r "../artifacts/MeshEditor-${VERSION}-webcomponent-lib.zip" . && cd ..

      - name: Upload Web & Library Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-web-and-lib
          path: artifacts/*
          if-no-files-found: error

      - name: Upload itch.io HTML5 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-itch-html5
          path: dist-itch/
          if-no-files-found: error

  # ============================================================================
  # 2. BUILD NATIVE DESKTOP APPS (macOS, Windows, Linux)
  # ============================================================================
  build-desktop:
    name: Build Desktop (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_name: macOS (arm64 & x64)
            build_cmd: npx electron-builder --mac --publish never --config electron-builder.yml
            artifact_name: release-desktop-macos
          - os: windows-latest
            platform_name: Windows (NSIS & Portable)
            build_cmd: npx electron-builder --win --publish never --config electron-builder.yml
            artifact_name: release-desktop-windows
          - os: ubuntu-latest
            platform_name: Linux (AppImage & deb)
            build_cmd: npx electron-builder --linux --publish never --config electron-builder.yml
            artifact_name: release-desktop-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (dist/)
        run: npm run build

      - name: Package Electron Desktop App (${{ matrix.platform_name }})
        env:
          # Disable automatic code-signing discovery if no certificates are configured in secrets
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.build_cmd }}

      - name: Upload Desktop Installers (${{ matrix.platform_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # ============================================================================
  # 3. CREATE GITHUB RELEASE & ATTACH ALL DISTRIBUTION ARTIFACTS
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs:
      - build-web-and-lib
      - build-desktop
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist-artifacts
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf "%f\n" | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Mesh Editor ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: dist-artifacts/*
          body: |
            ## 📦 Mesh Editor ${{ steps.release_meta.outputs.tag }} — Distribution Downloads

            ### 🖥️ Desktop Applications
            - **macOS (Apple Silicon `arm64` & Intel `x64`)**: `MeshEditor-*-mac-*.dmg` / `.zip`
            - **Windows (`x64` & `arm64`)**: `MeshEditor-*-win-*-nsis.exe` (Installer) / `MeshEditor-*-win-*-portable.exe` (Portable)
            - **Linux (`x64`)**: `MeshEditor-*-linux-x64.AppImage` / `MeshEditor-*-linux-x64.deb`

            ### 🌐 Web & NPM Library
            - **Official NPM Registry**: `npm install mesheditor` (or `npm install mesheditor@${{ steps.release_meta.outputs.tag }}`)
            - **Standalone Web Application**: `MeshEditor-*-standalone-web.zip` (Ready to host on any static web server)
            - **Web Component & Library Bundle**: `MeshEditor-*-webcomponent-lib.zip` & `mesheditor-*.tgz` (`npm install ./mesheditor-*.tgz`)

            ---
            > [!TIP]
            > **macOS Gatekeeper Note**: Because this open-source build is distributed without a paid Apple Developer certificate, macOS may show a warning that the app *"is damaged and can't be opened"* due to the browser quarantine attribute. To run the app, open Terminal and execute:
            > ```bash
            > xattr -cr "/Applications/Mesh Editor.app"
            > ```
            > Or navigate to **System Settings > Privacy & Security** and click **"Open Anyway"**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 4. PUBLISH PACKAGE TO NPM REGISTRY (registry.npmjs.org)
  # ============================================================================
  publish-npm:
    name: Publish to NPM Registry
    needs:
      - build-web-and-lib
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build NPM Library & Web Component
        run: npm run build:lib

      - name: Sync package.json version with release tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' if present (e.g. v1.0.2 -> 1.0.2)
          VERSION="${TAG#v}"
          echo "Syncing package.json version to: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to NPM Registry
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::warning::NPM_TOKEN secret is not configured in repository secrets. Skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================================================
  # 5. PUBLISH HTML5 & DESKTOP BUILDS TO ITCH.IO (butler)
  # ============================================================================
  publish-itch:
    name: Publish to itch.io
    needs:
      - build-web-and-lib
      - build-desktop
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.publish_itch == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check itch.io API key
        id: check_key
        env:
          ITCH_KEY_VAL: ${{ secrets.ITCH_KEY }}
        run: |
          if [ -z "${ITCH_KEY_VAL}" ]; then
            echo "::warning::ITCH_KEY secret is not configured in repository secrets. Skipping itch.io publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release version
        if: steps.check_key.outputs.skip != 'true'
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.create_release }}" == "true" ]]; then
              TAG="${{ inputs.tag_name }}"
              VERSION="${TAG#v}"
            else
              VERSION=$(node -p "require('./package.json').version")
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing Mesh Editor version ${VERSION} to itch.io"

      - name: Download itch.io HTML5 artifact
        if: steps.check_key.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-itch-html5
          path: artifacts-itch/html5

      - name: Download Desktop artifacts
        if: steps.check_key.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-desktop-*
          path: artifacts-itch/desktop

      - name: Install itch.io butler CLI
        if: steps.check_key.outputs.skip != 'true'
        run: |
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          echo "$PWD/butler-bin" >> "$GITHUB_PATH"
          ./butler-bin/butler -V

      - name: Push HTML5 & Desktop channels to itch.io
        if: steps.check_key.outputs.skip != 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_KEY }}
          ITCH_TARGET: peer2p/mesh-editor
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          echo "Pushing HTML5 build to ${ITCH_TARGET}:html5..."
          butler push artifacts-itch/html5 "${ITCH_TARGET}:html5" --userversion "${VERSION}"

          WIN_PORTABLE=$(find artifacts-itch/desktop -name "*-win-*-portable.exe" | head -n 1 || true)
          if [ -n "${WIN_PORTABLE}" ]; then
            mkdir -p staging-win
            cp "${WIN_PORTABLE}" staging-win/
            echo "Pushing Windows Portable build (${WIN_PORTABLE}) to ${ITCH_TARGET}:windows..."
            butler push staging-win "${ITCH_TARGET}:windows" --userversion "${VERSION}"
          fi

          MAC_ARM64=$(find artifacts-itch/desktop -name "*-mac-arm64.zip" | head -n 1 || true)
          if [ -n "${MAC_ARM64}" ]; then
            echo "Pushing macOS arm64 build (${MAC_ARM64}) to ${ITCH_TARGET}:osx-arm64..."
            butler push "${MAC_ARM64}" "${ITCH_TARGET}:osx-arm64" --userversion "${VERSION}"
          fi

          MAC_X64=$(find artifacts-itch/desktop -name "*-mac-x64.zip" | head -n 1 || true)
          if [ -n "${MAC_X64}" ]; then
            echo "Pushing macOS x64 build (${MAC_X64}) to ${ITCH_TARGET}:osx-x64..."
            butler push "${MAC_X64}" "${ITCH_TARGET}:osx-x64" --userversion "${VERSION}"
          fi

          LINUX_APPIMAGE=$(find artifacts-itch/desktop -name "*-linux-*.AppImage" | head -n 1 || true)
          if [ -n "${LINUX_APPIMAGE}" ]; then
            mkdir -p staging-linux
            cp "${LINUX_APPIMAGE}" staging-linux/
            echo "Pushing Linux AppImage (${LINUX_APPIMAGE}) to ${ITCH_TARGET}:linux..."
            butler push staging-linux "${ITCH_TARGET}:linux" --userversion "${VERSION}"
          fi

  # ============================================================================
  # 6. PUBLISH HTML5 & DESKTOP BUILDS TO GAME JOLT (gjpush)
  # ============================================================================
  publish-gamejolt:
    name: Publish to Game Jolt
    needs:
      - build-web-and-lib
      - build-desktop
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.publish_gamejolt == true))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Game Jolt credentials
        id: check_gj
        env:
          GJ_TOKEN_VAL: ${{ secrets.GAMEJOLT_TOKEN }}
          GJ_PKG_VAL: ${{ secrets.GAMEJOLT_PACKAGE_ID || vars.GAMEJOLT_PACKAGE_ID }}
        run: |
          if [ -z "${GJ_TOKEN_VAL}" ] || [ -z "${GJ_PKG_VAL}" ]; then
            echo "::warning::GAMEJOLT_TOKEN or GAMEJOLT_PACKAGE_ID is not configured in repository secrets/variables. Skipping Game Jolt publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release version (SemVer)
        if: steps.check_gj.outputs.skip != 'true'
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.create_release }}" == "true" ]]; then
              TAG="${{ inputs.tag_name }}"
              VERSION="${TAG#v}"
            else
              VERSION=$(node -p "require('./package.json').version")
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing Mesh Editor version ${VERSION} to Game Jolt"

      - name: Download HTML5 artifact
        if: steps.check_gj.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-itch-html5
          path: artifacts-gamejolt/html5

      - name: Download Desktop artifacts
        if: steps.check_gj.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-desktop-*
          path: artifacts-gamejolt/desktop

      - name: Install Game Jolt CLI (gjpush)
        if: steps.check_gj.outputs.skip != 'true'
        run: |
          curl -fsSL -o gjpush-linux.zip "https://github.com/gamejolt/cli/releases/download/v0.5.0/linux.zip"
          unzip -q gjpush-linux.zip -d gjpush-bin
          chmod +x gjpush-bin/gjpush
          echo "$PWD/gjpush-bin" >> "$GITHUB_PATH"
          ./gjpush-bin/gjpush --version

      - name: Push Browser & Desktop builds to Game Jolt
        if: steps.check_gj.outputs.skip != 'true'
        env:
          GJPUSH_TOKEN: ${{ secrets.GAMEJOLT_TOKEN }}
          GAME_ID: ${{ secrets.GAMEJOLT_GAME_ID || vars.GAMEJOLT_GAME_ID || '1122865' }}
          PACKAGE_ID: ${{ secrets.GAMEJOLT_PACKAGE_ID || vars.GAMEJOLT_PACKAGE_ID }}
          BROWSER_PACKAGE_ID: ${{ secrets.GAMEJOLT_BROWSER_PACKAGE_ID || vars.GAMEJOLT_BROWSER_PACKAGE_ID }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          TARGET_BROWSER_PKG="${BROWSER_PACKAGE_ID:-$PACKAGE_ID}"

          # 1. Browser (HTML5) Build (-b flag, index.html at archive root)
          BROWSER_ZIP="$PWD/MeshEditor-${VERSION}-browser.zip"
          (cd artifacts-gamejolt/html5 && zip -r -q "${BROWSER_ZIP}" .)
          echo "Pushing Browser (HTML5) build to Game Jolt (Game: ${GAME_ID}, Package: ${TARGET_BROWSER_PKG}, Release: ${VERSION})..."
          gjpush -g "${GAME_ID}" -p "${TARGET_BROWSER_PKG}" -r "${VERSION}" -b "${BROWSER_ZIP}"

          # 2. Windows Portable Build
          WIN_PORTABLE=$(find artifacts-gamejolt/desktop -name "*-win-*-portable.exe" | head -n 1 || true)
          if [ -n "${WIN_PORTABLE}" ]; then
            echo "Pushing Windows Portable build (${WIN_PORTABLE}) to Game Jolt..."
            gjpush -g "${GAME_ID}" -p "${PACKAGE_ID}" -r "${VERSION}" "${WIN_PORTABLE}"
          fi

          # 3. macOS Builds (Apple Silicon arm64 & Intel x64 .zip app bundles)
          MAC_ARM64=$(find artifacts-gamejolt/desktop -name "*-mac-arm64.zip" | head -n 1 || true)
          if [ -n "${MAC_ARM64}" ]; then
            echo "Pushing macOS arm64 build (${MAC_ARM64}) to Game Jolt..."
            gjpush -g "${GAME_ID}" -p "${PACKAGE_ID}" -r "${VERSION}" "${MAC_ARM64}"
          fi

          MAC_X64=$(find artifacts-gamejolt/desktop -name "*-mac-x64.zip" | head -n 1 || true)
          if [ -n "${MAC_X64}" ]; then
            echo "Pushing macOS x64 build (${MAC_X64}) to Game Jolt..."
            gjpush -g "${GAME_ID}" -p "${PACKAGE_ID}" -r "${VERSION}" "${MAC_X64}"
          fi

          # 4. Linux AppImage Build
          LINUX_APPIMAGE=$(find artifacts-gamejolt/desktop -name "*-linux-*.AppImage" | head -n 1 || true)
          if [ -n "${LINUX_APPIMAGE}" ]; then
            echo "Pushing Linux AppImage build (${LINUX_APPIMAGE}) to Game Jolt..."
            gjpush -g "${GAME_ID}" -p "${PACKAGE_ID}" -r "${VERSION}" "${LINUX_APPIMAGE}"
          fi

