appId: com.mesheditor.app
productName: Mesh Editor
copyright: Copyright © 2026 Daniel Peer

extraMetadata:
  main: electron/main.js

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - build/**/*
  - package.json
  - "!node_modules/**/*"

artifactName: "MeshEditor-${version}-${os}-${arch}.${ext}"

fileAssociations:
  - ext: glb
    name: Binary glTF 3D Model
    description: 3D model in binary glTF format
    role: Editor
    icon: icons/document-3d.icns
  - ext: gltf
    name: glTF 2.0 3D Model
    description: 3D model scene in glTF format
    role: Editor
    icon: icons/document-3d.icns
  - ext: obj
    name: Wavefront OBJ 3D Model
    description: Wavefront OBJ 3D model geometry
    role: Editor
    icon: icons/document-3d.icns
  - ext: stl
    name: Stereolithography 3D Mesh
    description: Stereolithography STL surface mesh for 3D modeling and printing
    role: Editor
    icon: icons/document-3d.icns
  - ext: ply
    name: Polygon 3D File
    description: Polygon 3D File Format
    role: Editor
    icon: icons/document-3d.icns
  - ext: babylon
    name: Babylon.js 3D Scene
    description: Babylon.js 3D Scene File
    role: Editor
    icon: icons/document-3d.icns

mac:
  category: public.app-category.graphics-design
  icon: build/icon.icns
  darkModeSupport: true
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: "MeshEditor-${version}-win-${arch}-nsis.${ext}"

portable:
  artifactName: "MeshEditor-${version}-win-${arch}-portable.${ext}"

linux:
  category: Graphics
  icon: build/icon.png
  maintainer: daniel.peer@gmx.net
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
